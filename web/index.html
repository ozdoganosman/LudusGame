<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070f" />
    <meta
      name="description"
      content="Kuşat — Volfied tarzı alan kapatma oyunu. Kenardan içeri dal, izini bağla, alanı ele geçir."
    />
    <title>Kuşat</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070f'/%3E%3Crect x='4' y='16' width='10' height='12' fill='%231b4b8f'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23ff3b7f'/%3E%3C/svg%3E" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      #hud {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 14px 8px;
      }

      .hud-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .label {
        display: block;
        font-size: 10px;
        letter-spacing: 1.4px;
        font-weight: 600;
        color: var(--text-dim);
      }

      #level {
        font-size: 20px;
        font-weight: 800;
      }

      .score {
        flex: 1;
        text-align: center;
      }

      .score strong {
        display: block;
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      #pause {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--filled);
        background: transparent;
        color: var(--accent);
        font-size: 13px;
        letter-spacing: 2px;
        cursor: pointer;
      }

      .bar {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: var(--surface);
        overflow: hidden;
      }

      #bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: var(--accent);
        transition: width 120ms linear;
      }

      #percent {
        min-width: 104px;
        text-align: right;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }

      #percent.reached {
        color: var(--gold);
      }

      #bar-fill.reached {
        background: var(--gold);
      }

      #lives {
        display: flex;
        gap: 6px;
        height: 10px;
      }

      #lives span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--player-glow);
      }

      #stage {
        flex: 1;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      canvas {
        display: block;
        border-radius: 2px;
      }

      #stick {
        position: relative;
        height: 150px;
        flex: none;
        display: grid;
        place-items: center;
      }

      #stick-hint {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 2px solid var(--filled);
        opacity: 0.5;
      }

      #stick-hint::after {
        content: "";
        display: block;
        width: 34px;
        height: 34px;
        margin: 29px auto;
        border-radius: 50%;
        background: var(--filled);
        opacity: 0.6;
      }

      #stick-base,
      #stick-knob {
        position: fixed;
        pointer-events: none;
        display: none;
      }

      #stick-base {
        width: 108px;
        height: 108px;
        margin: -54px 0 0 -54px;
        border-radius: 50%;
        border: 2px solid var(--filled-edge);
        opacity: 0.45;
      }

      #stick-knob {
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.85;
      }

      body.dragging #stick-base,
      body.dragging #stick-knob {
        display: block;
      }

      body.dragging #stick-hint {
        opacity: 0.15;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(5, 7, 15, 0.86);
      }

      #overlay[hidden] {
        display: none;
      }

      .panel {
        width: 100%;
        max-width: 340px;
        padding: 22px;
        border-radius: 18px;
        border: 1px solid var(--filled);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .panel h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1px;
        text-align: center;
      }

      .panel p {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: var(--text-dim);
        text-align: center;
      }

      .panel p.hint {
        font-size: 12px;
        line-height: 18px;
      }

      .panel p:empty,
      .panel dl:empty {
        display: none;
      }

      .panel dl {
        margin: 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        padding: 6px 0;
      }

      .panel dt {
        font-size: 13px;
        letter-spacing: 0.6px;
        color: var(--text-dim);
      }

      .panel dd {
        margin: 0;
        text-align: right;
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .panel button {
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--background);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.8px;
        cursor: pointer;
      }

      .panel button.ghost {
        background: transparent;
        border: 1px solid var(--filled);
        color: var(--text);
      }

      .panel button[hidden] {
        display: none;
      }

      .panel button:active {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-row">
          <div>
            <span class="label">SEVİYE</span>
            <strong id="level">1</strong>
          </div>
          <div class="score">
            <strong id="score">0</strong>
            <span class="label" id="high">REKOR 0</span>
          </div>
          <button id="pause" type="button" aria-label="Duraklat">❚❚</button>
        </div>
        <div class="hud-row">
          <div class="bar"><div id="bar-fill"></div></div>
          <span id="percent">%0.0 / %80</span>
        </div>
        <div id="lives"></div>
      </header>

      <main id="stage"><canvas id="field"></canvas></main>

      <footer id="stick"><div id="stick-hint"></div></footer>
    </div>

    <div id="stick-base"></div>
    <div id="stick-knob"></div>

    <div id="overlay" hidden>
      <div class="panel">
        <h1 id="ov-title"></h1>
        <p id="ov-sub"></p>
        <dl id="ov-rows"></dl>
        <p class="hint" id="ov-hint"></p>
        <button id="ov-primary" type="button"></button>
        <button id="ov-secondary" class="ghost" type="button" hidden></button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
