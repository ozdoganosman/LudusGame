name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Tip kontrolü, lint ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Motor testleri
        run: npm test

      - name: Web sürümünü derle
        run: npm run build:web
